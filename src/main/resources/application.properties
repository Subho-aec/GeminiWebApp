# ═══════════════════════════════════════════════════════════════════════
#  MedBot AI — Application Configuration
#  API keys are read from environment variables for security.
#  Set them in your shell, .env file, or Render dashboard.
# ═══════════════════════════════════════════════════════════════════════

spring.application.name=MedBot AI

# Server
server.port=${PORT:8084}

# Google Gemini AI
gemini.api.key=${GEMINI_API_KEY:AIzaSyAZRI2EkWeMXuv0dVH88NnQ4-UfkiOw89g}
google.gemini.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# Spring Actuator — expose health and info endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha

# File upload limits (for voice input)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.subho.medbot=INFO
logging.level.org.springframework.web=WARN